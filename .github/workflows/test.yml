name: Tests
on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - name: Run tests
        run: npm test -- --run
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
